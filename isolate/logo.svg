  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="none" stroke="#e8c26a" stroke-opacity="0.35" stroke-width="8"/>
  <circle cx="256" cy="215" r="190" fill="url(#glow)"/>

