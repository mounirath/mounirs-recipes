  </g>

  <!-- Sparkles -->
  <path d="M386 92 C390 116 401 127 425 131 C401 135 390 146 386 170 C382 146 371 135 347 131 C371 127 382 116 386 92 Z" fill="url(#gold)"/>
  <path d="M140 132 C142.5 146 149 152.5 163 155 C149 157.5 142.5 164 140 178 C137.5 164 131 157.5 117 155 C131 152.5 137.5 146 140 132 Z" fill="url(#gold)" opacity="0.65"/>
