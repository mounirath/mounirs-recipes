name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor if needed
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Mounir's Recipes" "com.mounirath.recipes" --web-dir dist
          fi

      - name: Ensure Android platform exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Create Convex Stub
        shell: bash
        run: |
          mkdir -p src/convex/_generated
          printf 'export const api = {} as any;\n' > src/convex/_generated/api.js
          printf 'export declare const api: any;\n' > src/convex/_generated/api.d.ts

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to root
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/mounirs-recipes-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mounirs-recipes-apk
          path: release/mounirs-recipes-debug.apk
          if-no-files-found: error
          retention-days: 30
