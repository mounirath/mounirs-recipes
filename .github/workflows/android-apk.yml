name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerate Convex bindings in CI. Harmless if it fails (no deployment
      # auth in CI): the committed src/convex/_generated files are the fallback.
      - name: Generate Convex types
        run: bunx convex codegen --typecheck=disable || echo "codegen skipped, using committed generated files"

      # `vite build` directly (not `bun run build`) so the CI APK build does
      # not depend on `tsc -b` passing — typechecking is a dev-time concern.
      - name: Build web app (Vite)
        env:
          # Define this secret in GitHub: Settings > Secrets and variables > Actions
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: bunx vite build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      # Capacitor 8 requires Java 21 (compileOptions VERSION_21)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME=/usr/local/lib/android/sdk) — no setup-android action
      # needed. Gradle auto-installs missing platform/build-tools once the
      # licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
